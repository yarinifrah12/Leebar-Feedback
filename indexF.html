<!doctype html>
<html lang="en" class="kiosk-page">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>משוב חדר אוכל LEE BAR</title>
<link rel="icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="theme-color" content="#5B2D12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Secular+One&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
  [hidden]{display:none!important}
  body{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  .setup-msg{max-width:560px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;line-height:1.6}
  .setup-msg code{direction:ltr;unicode-bidi:embed;background:var(--soft);padding:1px 6px;border-radius:6px}
</style>
</head>
<body>
<div id="kiosk" dir="ltr" lang="en">
  <header class="k-top">
    <div style="display:flex;align-items:center;gap:12px;min-width:0;flex-wrap:wrap">
      <div class="brand" id="kBrand"></div>
      <span class="partner" id="kPartner" hidden></span>
    </div>
    <div class="k-tools">
      <button class="chip-btn" id="lEn" aria-pressed="true">English</button>
      <button class="chip-btn" id="lHe" aria-pressed="false">עברית</button>
    </div>
  </header>
  <main class="k-main" id="kMain" aria-live="polite"></main>
  <footer class="k-foot">
    <div class="progress" id="kProg" aria-hidden="true"></div>
    <div class="foot-r"><span class="st-name" id="kStation" dir="auto"></span><div class="status" id="kStatus"><b></b><span id="kStatusTxt">Anonymous</span></div></div>
  </footer>
</div>
<div class="toast" id="toast" hidden></div>
<script src="config.js"></script>
<script src="assets/msal-browser.min.js"></script>
<script src="assets/common.js"></script>
<script src="assets/store.js"></script>
<script src="assets/kiosk.js"></script>
</body>
</html>
